[project]
name = "antiphishing-backend"
version = "0.1.0"
description = "Antiphishing Platform Backend API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "sqlalchemy[asyncio]>=2.0.28",
    "asyncpg>=0.29.0",
    "pydantic-settings>=2.2.1",
    "alembic>=1.13.1",
    "langchain>=0.1.13",
    "reportlab>=4.1.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.2",
    "argon2-cffi>=23.1.0",
    "pyjwt[crypto]>=2.8.0",
    "python-multipart>=0.0.9",
    "redis>=5.0.3",
    "uvicorn[standard]>=0.28.0",
    "httpx>=0.27.0",
    "slowapi>=0.1.9"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
