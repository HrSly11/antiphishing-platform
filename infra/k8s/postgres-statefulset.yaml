apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: antiphishing-postgres
  namespace: antiphishing-soc
spec:
  serviceName: antiphishing-postgres
  replicas: 1
  selector:
    matchLabels:
      app: antiphishing-postgres
  template:
    metadata:
      labels:
        app: antiphishing-postgres
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          ports:
            - containerPort: 5432
              name: postgres
          envFrom:
            - secretRef:
                name: antiphishing-db-credentials
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "antiphishing_db"]
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 50Gi
---
apiVersion: v1
kind: Service
metadata:
  name: antiphishing-postgres
  namespace: antiphishing-soc
spec:
  clusterIP: None
  selector:
    app: antiphishing-postgres
  ports:
    - port: 5432
      targetPort: 5432
