name: CI Backend

on:
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
      - "docs/**"
      - ".github/workflows/ci-backend.yml"
  pull_request:
    branches: [main, develop]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: antiphishing_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PYTHONPATH: backend
      DATABASE_URL: postgresql+asyncpg://postgres:ci_password@127.0.0.1:5432/antiphishing_test
      SECRET_KEY: ci-ephemeral-signing-key-minimum-32-bytes-long-2026
      GATEWAY_API_KEY: ci-gateway-key-2026
      N8N_SERVICE_KEY: ci-n8n-service-key-2026
      LLM_PROVIDER: none

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./backend[dev]" || pip install ./backend pytest pytest-asyncio httpx ruff

      - name: Run Ruff linter
        run: ruff check backend/app

      - name: Apply Alembic migrations (0001 -> head)
        working-directory: backend
        run: python -m alembic upgrade head

      - name: Execute backend test suite
        run: pytest backend/tests -q
