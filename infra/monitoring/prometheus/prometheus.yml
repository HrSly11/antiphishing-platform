global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: "antiphishing-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["antiphishing-backend:8000"]
        labels:
          service: "antiphishing-backend"
          environment: "production"
