openapi: 3.1.0
info:
  title: Antiphishing Platform
  description: Enterprise Banking Antiphishing Platform — Hexagonal Architecture,
    Selective CQRS, LangChain/Ollama On-Premise AI, n8n SOAR Integration, and Tamper-Evident
    Audit Trail.
  version: 2.0.0
paths:
  /health:
    get:
      tags:
      - Health
      summary: Health Check
      description: Kubernetes / Docker liveness probe.
      operationId: health_check_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /ready:
    get:
      tags:
      - Health
      summary: Readiness Check
      description: Readiness probe verifying live PostgreSQL connectivity.
      operationId: readiness_check_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /metrics:
    get:
      tags:
      - Health
      summary: Prometheus Metrics
      description: Prometheus scrape endpoint exposing operational and detection metrics.
      operationId: prometheus_metrics_metrics_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/v1/health:
    get:
      tags:
      - Health
      summary: Health Check
      description: Kubernetes / Docker liveness probe.
      operationId: health_check_api_v1_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/v1/ready:
    get:
      tags:
      - Health
      summary: Readiness Check
      description: Readiness probe verifying live PostgreSQL connectivity.
      operationId: readiness_check_api_v1_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/v1/metrics:
    get:
      tags:
      - Health
      summary: Prometheus Metrics
      description: Prometheus scrape endpoint exposing operational and detection metrics.
      operationId: prometheus_metrics_api_v1_metrics_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/v1/auth/login:
    post:
      tags:
      - Auth
      summary: Login
      description: Authenticate SOC user with Argon2id + account lockout + optional
        RFC 6238 TOTP MFA.
      operationId: login_api_v1_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/refresh:
    post:
      tags:
      - Auth
      summary: Refresh Tokens
      description: Validate refresh JWT and issue rotated access & refresh tokens.
      operationId: refresh_tokens_api_v1_auth_refresh_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/me:
    get:
      tags:
      - Auth
      summary: Get Me
      description: Return current authenticated user profile and RBAC permissions.
      operationId: get_me_api_v1_auth_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/auth/logout:
    post:
      tags:
      - Auth
      summary: Logout
      description: Record explicit session logout in the append-only audit trail.
      operationId: logout_api_v1_auth_logout_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/auth/mfa/setup:
    post:
      tags:
      - Auth
      summary: Setup Mfa
      description: Generate a new RFC 6238 TOTP secret and provisioning URI for authenticator
        enrollment.
      operationId: setup_mfa_api_v1_auth_mfa_setup_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/auth/mfa/enable:
    post:
      tags:
      - Auth
      summary: Enable Mfa
      description: Verify a live TOTP code and enforce MFA on subsequent logins.
      operationId: enable_mfa_api_v1_auth_mfa_enable_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaVerifyRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/auth/mfa/disable:
    post:
      tags:
      - Auth
      summary: Disable Mfa
      description: Disable TOTP MFA for the current user after optional code or password
        confirmation.
      operationId: disable_mfa_api_v1_auth_mfa_disable_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaDisableRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/auth/sso/providers:
    get:
      tags:
      - Auth
      summary: List Sso Providers
      description: Return enterprise identity federation readiness (Local Argon2id,
        SAML 2.0/OIDC, LDAPS).
      operationId: list_sso_providers_api_v1_auth_sso_providers_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/v1/users:
    get:
      tags:
      - Users
      summary: List Users
      description: List all SOC platform users with lockout and MFA posture.
      operationId: list_users_api_v1_users_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/UserOut'
                type: array
                title: Response List Users Api V1 Users Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
    post:
      tags:
      - Users
      summary: Create User
      description: Create a new user enforcing PCI-DSS 8.3 password complexity and
        Argon2id hashing.
      operationId: create_user_api_v1_users_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/users/roles:
    get:
      tags:
      - Users
      summary: Get Rbac Matrix
      description: Return the role-to-permissions RBAC matrix.
      operationId: get_rbac_matrix_api_v1_users_roles_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/users/{user_id}:
    patch:
      tags:
      - Users
      summary: Update User
      description: Update user role, active status, unlock account, or rotate password.
      operationId: update_user_api_v1_users__user_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          title: User Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/detection/analyze-email:
    post:
      tags:
      - Detection
      summary: Analyze Email Endpoint
      description: Inline email inspection invoked by the corporate MTA gateway, n8n
        SOAR, or SOC analysts.
      operationId: analyze_email_endpoint_api_v1_detection_analyze_email_post
      security:
      - HTTPBearer: []
      parameters:
      - name: X-Gateway-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Gateway-Key
      - name: X-Service-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Service-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailAnalysisRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailAnalysisResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/detection/analyze-eml:
    post:
      tags:
      - Detection
      summary: Analyze Eml Endpoint
      description: 'Parse an RFC 822 `.eml` file upload or JSON `{"raw_eml": "..."}`
        and run inline detection.'
      operationId: analyze_eml_endpoint_api_v1_detection_analyze_eml_post
      security:
      - HTTPBearer: []
      parameters:
      - name: X-Gateway-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Gateway-Key
      - name: X-Service-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Service-Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailAnalysisResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
          application/json:
            schema:
              type: object
              properties:
                raw_eml:
                  type: string
              required:
              - raw_eml
  /api/v1/detection/analyze-url:
    post:
      tags:
      - Detection
      summary: Analyze Url Endpoint
      description: Inspect a standalone URL, SMS smishing link, or decoded QR quishing
        target.
      operationId: analyze_url_endpoint_api_v1_detection_analyze_url_post
      security:
      - HTTPBearer: []
      parameters:
      - name: X-Gateway-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Gateway-Key
      - name: X-Service-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Service-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UrlAnalysisRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailAnalysisResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/detection/report-phishing:
    post:
      tags:
      - Detection
      summary: Report Phishing Endpoint
      description: Employee 'Reportar phishing' button intake; auto-triages incidents
        when risk_score >= 35.
      operationId: report_phishing_endpoint_api_v1_detection_report_phishing_post
      security:
      - HTTPBearer: []
      parameters:
      - name: X-Gateway-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Gateway-Key
      - name: X-Service-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Service-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeePhishingReportRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailAnalysisResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/detection/verdicts:
    get:
      tags:
      - Detection
      summary: List Verdicts
      description: Paginated list of persisted detection verdicts with multi-criteria
        filtering.
      operationId: list_verdicts_api_v1_detection_verdicts_get
      security:
      - HTTPBearer: []
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 25
          title: Page Size
      - name: verdict
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Verdict
      - name: channel
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Channel
      - name: analyst_label
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Analyst Label
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Q
      - name: date_from
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Date From
      - name: date_to
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Date To
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerdictPage'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/detection/verdicts/{verdict_id}:
    get:
      tags:
      - Detection
      summary: Get Verdict Detail
      description: Return full forensic detail for a single detection verdict.
      operationId: get_verdict_detail_api_v1_detection_verdicts__verdict_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: verdict_id
        in: path
        required: true
        schema:
          type: string
          title: Verdict Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerdictOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/detection/verdicts/{verdict_id}/label:
    patch:
      tags:
      - Detection
      summary: Label Verdict
      description: Set analyst feedback label (`TRUE_POSITIVE` | `FALSE_POSITIVE`
        | `UNREVIEWED`).
      operationId: label_verdict_api_v1_detection_verdicts__verdict_id__label_patch
      security:
      - HTTPBearer: []
      parameters:
      - name: verdict_id
        in: path
        required: true
        schema:
          type: string
          title: Verdict Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LabelRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerdictOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/dashboard/kpis:
    get:
      tags:
      - Dashboard
      summary: Get Dashboard Kpis
      description: Compute real-time analytical SOC KPIs, confusion rates, latencies,
        trends, and SLA compliance.
      operationId: get_dashboard_kpis_api_v1_dashboard_kpis_get
      security:
      - HTTPBearer: []
      parameters:
      - name: window_days
        in: query
        required: false
        schema:
          type: integer
          maximum: 365
          minimum: 1
          default: 30
          title: Window Days
      - name: X-Service-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Service-Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Get Dashboard Kpis Api V1 Dashboard Kpis Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/incidents:
    get:
      tags:
      - Incidents
      summary: List Incidents
      description: Paginated list of SOC phishing incidents with status, severity,
        and SLA breach filters.
      operationId: list_incidents_api_v1_incidents_get
      security:
      - HTTPBearer: []
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 25
          title: Page Size
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
      - name: severity
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Severity
      - name: overdue_only
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Overdue Only
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentPage'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Incidents
      summary: Create Incident
      description: Create a manual SOC incident and record immutable creation audit
        trail.
      operationId: create_incident_api_v1_incidents_post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManualIncidentCreateRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Create Incident Api V1 Incidents Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/incidents/escalate-overdue:
    post:
      tags:
      - Incidents
      summary: Escalate Overdue Incidents
      description: Sweep open incidents past their SLA deadline, escalate them, and
        queue n8n alerts.
      operationId: escalate_overdue_incidents_api_v1_incidents_escalate_overdue_post
      security:
      - HTTPBearer: []
      parameters:
      - name: X-Service-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Service-Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Escalate Overdue Incidents Api V1 Incidents Escalate
                  Overdue Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/incidents/{incident_id}:
    get:
      tags:
      - Incidents
      summary: Get Incident Detail
      description: Return full incident details, immutable timeline events, linked
        IOCs, and SLA status.
      operationId: get_incident_detail_api_v1_incidents__incident_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: incident_id
        in: path
        required: true
        schema:
          type: string
          title: Incident Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Get Incident Detail Api V1 Incidents  Incident Id  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/incidents/{incident_id}/transition:
    post:
      tags:
      - Incidents
      summary: Transition Incident
      description: Transition incident state (`OPEN -> TRIAGED -> INVESTIGATING ->
        CONTAINED -> CLOSED`).
      operationId: transition_incident_api_v1_incidents__incident_id__transition_post
      security:
      - HTTPBearer: []
      parameters:
      - name: incident_id
        in: path
        required: true
        schema:
          type: string
          title: Incident Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncidentTransitionPayload'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Transition Incident Api V1 Incidents  Incident Id  Transition
                  Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/incidents/{incident_id}/assign:
    post:
      tags:
      - Incidents
      summary: Assign Incident
      description: Assign or reassign an incident to a SOC analyst.
      operationId: assign_incident_api_v1_incidents__incident_id__assign_post
      security:
      - HTTPBearer: []
      parameters:
      - name: incident_id
        in: path
        required: true
        schema:
          type: string
          title: Incident Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncidentAssignPayload'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
