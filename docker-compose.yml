services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: antiphishing-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-12345}
      POSTGRES_DB: ${POSTGRES_DB:-antiphishing_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-antiphishing_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: antiphishing-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: antiphishing-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollamadata:/root/.ollama

  n8n:
    image: n8nio/n8n:1.68.0
    container_name: antiphishing-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - GENERIC_TIMEZONE=UTC
      - N8N_SERVICE_KEY=${N8N_SERVICE_KEY:-dev-n8n-service-key}
      - N8N_WEBHOOK_SECRET=${N8N_WEBHOOK_SECRET:-dev-n8n-hmac-secret}
    volumes:
      - n8ndata:/home/node/.n8n
      - ./backend/n8n/workflows:/workflows:ro

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: antiphishing-backend
    restart: unless-stopped
    volumes:
      - ./backend:/app
      - ./docs:/docs:ro
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - DATABASE_URL=postgresql+asyncpg://postgres:12345@postgres:5432/antiphishing_db
      - OLLAMA_BASE_URL=http://ollama:11434
      - N8N_WEBHOOK_URL=http://n8n:5678/webhook
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: antiphishing-frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api/v1
    depends_on:
      - backend

volumes:
  pgdata:
  ollamadata:
  n8ndata:
